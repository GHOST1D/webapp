<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GHOST1D Player</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;width:100%;overflow:hidden;touch-action:none;
font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:#fff;}

#bgFull{
  position:fixed;inset:0;z-index:0;
  background:#1a0a2e center/cover no-repeat;
  filter:brightness(.7) saturate(1.4);
  transition:background-image .8s ease;
}
#bgGrad{
  position:fixed;inset:0;z-index:1;
  background:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,0) 30%,rgba(0,0,0,.6) 65%,rgba(0,0,0,.88) 100%);
}
#app{
  position:relative;z-index:2;
  width:100%;max-width:440px;height:100%;
  margin:0 auto;display:flex;flex-direction:column;
  padding:14px 26px 20px;justify-content:space-between;
}

header{display:flex;justify-content:space-between;align-items:center;}

/* ── Spacer ── */
.spacer{flex:1;}

/* ── Metadata ── */
.meta{margin-bottom:14px;}
#songTitle{
  font-size:22px;font-weight:800;letter-spacing:-.4px;
  text-shadow:0 2px 12px rgba(0,0,0,.9);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.meta-sub{display:flex;align-items:center;gap:8px;margin-top:5px;}
#songArtist{
  font-size:14px;font-weight:400;opacity:.75;
  text-shadow:0 1px 6px rgba(0,0,0,.8);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px;
}
/* Estrella de favoritos */
#starBtn{
  background:none;border:none;cursor:pointer;
  margin-left:auto;font-size:22px;flex-shrink:0;
  transition:transform .2s,opacity .15s;
  filter:drop-shadow(0 1px 4px rgba(0,0,0,.8));
}
#starBtn:active{transform:scale(.8);}
#starBtn.fav{color:#ffd60a;}

/* ── Barra de progreso ── */
.times-row{
  display:flex;justify-content:space-between;
  font-size:12px;opacity:.65;font-variant-numeric:tabular-nums;
  margin-bottom:5px;text-shadow:0 1px 4px rgba(0,0,0,.9);
}
#seekBar{
  width:100%;height:4px;appearance:none;
  background:rgba(255,255,255,.3);border-radius:4px;
  cursor:pointer;outline:none;margin-bottom:12px;
}
#seekBar::-webkit-slider-thumb{
  appearance:none;width:16px;height:16px;border-radius:50%;
  background:#fff;box-shadow:0 0 6px rgba(0,0,0,.6);cursor:pointer;
}

/* ── Controles ── */
.controls{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:16px;padding:0 4px;
}
.ctrl-btn{
  background:none;border:none;cursor:pointer;
  color:rgba(255,255,255,.85);
  display:flex;align-items:center;justify-content:center;
  transition:opacity .15s,transform .1s;padding:6px;
}
.ctrl-btn:active{opacity:.4;transform:scale(.82);}
.ctrl-btn.dim{opacity:.25;pointer-events:none;}
#playBtn{
  width:66px;height:66px;border-radius:50%;border:none;cursor:pointer;
  background:rgba(255,255,255,.92);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 24px rgba(0,0,0,.55);
  transition:transform .1s,opacity .15s;
}
#playBtn:active{transform:scale(.9);opacity:.8;}
.play-icon{width:30px;height:30px;fill:#000;}

/* ── Volumen ── */
.volume-row{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
.vol-icon{width:18px;height:18px;opacity:.55;flex-shrink:0;}
#volBar{flex:1;height:3px;appearance:none;background:rgba(255,255,255,.3);border-radius:4px;cursor:pointer;outline:none;}
#volBar::-webkit-slider-thumb{appearance:none;width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.9);cursor:pointer;}

/* ── Footer ── */
footer{display:flex;justify-content:space-between;align-items:center;padding:0 8px;}
.foot-btn{
  background:none;border:none;cursor:pointer;
  color:rgba(255,255,255,.6);padding:6px;
  display:flex;align-items:center;
  transition:color .2s,opacity .15s;
}
.foot-btn:active{opacity:.4;}
.foot-btn.active{color:#fff;}

/* ════════════════════════════════════════════════════
   PANEL LETRAS (Shazam style)
════════════════════════════════════════════════════ */
.overlay-panel{
  position:fixed;inset:0;z-index:50;
  display:none;flex-direction:column;
  background:rgba(0,0,0,.82);backdrop-filter:blur(22px);
  padding:24px 22px 100px;
  animation:slideUp .3s ease;
}
.overlay-panel.visible{display:flex;}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.panel-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
.panel-hdr-title{font-size:13px;font-weight:600;opacity:.65;letter-spacing:.5px;text-transform:uppercase;}
.panel-close{background:none;border:none;cursor:pointer;color:rgba(255,255,255,.65);font-size:22px;}

/* Letras */
#lyricsScroll{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;}
#lyricsScroll::-webkit-scrollbar{display:none;}
.lyric-line{text-align:center;font-size:17px;font-weight:600;
  color:rgba(255,255,255,.28);padding:10px 4px;line-height:1.5;
  transition:color .3s,font-size .3s,text-shadow .3s;}
.lyric-line.active{color:#fff;font-size:21px;text-shadow:0 0 30px rgba(255,255,255,.6);}
.lyric-line.past{color:rgba(255,255,255,.15);}
.lyric-loading,.lyric-none{text-align:center;color:rgba(255,255,255,.4);font-size:14px;padding:60px 20px;line-height:2;}

/* ════════════════════════════════════════════════════
   PANEL PLAYLIST
════════════════════════════════════════════════════ */
#playlistPanel{
  position:fixed;inset:0;z-index:50;
  display:none;flex-direction:column;
  background:rgba(0,0,0,.88);backdrop-filter:blur(22px);
}
#playlistPanel.visible{display:flex;}
#plScroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
#plScroll::-webkit-scrollbar{display:none;}
.pl-item{
  display:flex;align-items:center;gap:14px;
  padding:13px 26px;
  border-bottom:1px solid rgba(255,255,255,.06);
  cursor:pointer;transition:background .15s;
}
.pl-item:active{background:rgba(255,255,255,.08);}
.pl-item.pl-active{background:rgba(255,255,255,.07);}
.pl-num{
  font-size:14px;font-variant-numeric:tabular-nums;
  opacity:.35;width:20px;text-align:right;flex-shrink:0;
}
.pl-item.pl-active .pl-num{opacity:0;}
.pl-play-anim{display:none;width:20px;flex-shrink:0;align-items:center;justify-content:center;}
.pl-item.pl-active .pl-play-anim{display:flex;}
.pl-bars{display:flex;align-items:flex-end;gap:2px;height:14px;}
.pl-bar{width:3px;border-radius:1px;background:#38bdf8;animation:plbar 1s ease-in-out infinite alternate;}
.pl-bar:nth-child(1){height:5px;animation-delay:0s;}
.pl-bar:nth-child(2){height:11px;animation-delay:.2s;}
.pl-bar:nth-child(3){height:8px;animation-delay:.4s;}
@keyframes plbar{from{transform:scaleY(.4)}to{transform:scaleY(1)}}
.pl-info{flex:1;overflow:hidden;}
.pl-title{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pl-item.pl-active .pl-title{color:#38bdf8;}
.pl-artist{font-size:12px;opacity:.55;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* ════════════════════════════════════════════════════
   MODAL FAVORITOS
════════════════════════════════════════════════════ */
#favModal{
  position:fixed;inset:0;z-index:80;
  display:none;align-items:flex-end;justify-content:center;
  background:rgba(0,0,0,.6);
}
#favModal.visible{display:flex;}
.fav-sheet{
  width:100%;max-width:440px;
  background:rgba(28,28,40,.97);
  border-radius:24px 24px 0 0;
  padding:28px 26px 36px;
  animation:slideUp .3s ease;
}
.fav-sheet h3{font-size:17px;font-weight:700;margin-bottom:6px;}
.fav-sheet p{font-size:13px;opacity:.55;margin-bottom:18px;}
.fav-input{
  width:100%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);
  border-radius:12px;padding:12px 16px;color:#fff;font-size:15px;outline:none;
}
.fav-input::placeholder{color:rgba(255,255,255,.35);}
.fav-input:focus{border-color:rgba(56,189,248,.6);}
.fav-existing{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px;}
.fav-tag{
  padding:6px 14px;border-radius:99px;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);
  font-size:13px;cursor:pointer;transition:background .15s;
}
.fav-tag:active{background:rgba(56,189,248,.3);}
.fav-btns{display:flex;gap:10px;margin-top:20px;}
.fav-btn{
  flex:1;padding:14px;border-radius:14px;border:none;
  font-size:15px;font-weight:600;cursor:pointer;transition:opacity .15s;
}
.fav-btn:active{opacity:.7;}
.fav-cancel{background:rgba(255,255,255,.12);color:#fff;}
.fav-confirm{background:#38bdf8;color:#000;}
</style>
</head>
<body>

<div id="bgFull"></div>
<div id="bgGrad"></div>

<!-- ── PANEL LETRAS ── -->
<div id="lyricsOverlay" class="overlay-panel">
  <div class="panel-hdr">
    <span class="panel-hdr-title">🎤 Letras sincronizadas</span>
    <button class="panel-close" id="closeLyricsBtn">✕</button>
  </div>
  <div id="lyricsScroll"><div class="lyric-loading">Buscando letra...</div></div>
</div>

<!-- ── PANEL PLAYLIST (resultados búsqueda) ── -->
<div id="playlistPanel">
  <div style="padding:20px 26px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,.08);">

      <div style="font-size:11px;opacity:.45;letter-spacing:.5px;text-transform:uppercase;margin-bottom:2px;">Playlist</div>
      <div style="font-size:16px;font-weight:700;" id="plTitle">Resultados de búsqueda</div>
    </div>
    <button class="panel-close" id="closePlBtn">✕</button>
  </div>
  <div id="plScroll"></div>
</div>

<!-- ── PANEL MIS PLAYLISTS (⭐ guardadas) ── -->
<div id="myPlaylistsPanel" style="position:fixed;inset:0;z-index:55;display:none;flex-direction:column;background:rgba(0,0,0,.9);backdrop-filter:blur(24px);">
  <!-- Vista: lista de playlists -->
  <div id="mpListView" style="display:flex;flex-direction:column;height:100%;">
    <div style="padding:20px 26px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,.08);">
      <div>
        <div style="font-size:11px;opacity:.45;letter-spacing:.5px;text-transform:uppercase;margin-bottom:2px;">⭐ Mis Playlists</div>

      </div>
      <button class="panel-close" id="closeMpBtn">✕</button>
    </div>
    <div id="mpListScroll" style="flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:10px 0 30px;"></div>
  </div>
  <!-- Vista: canciones de una playlist -->
  <div id="mpSongsView" style="display:none;flex-direction:column;height:100%;">
    <div style="padding:20px 26px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,.08);">
      <div style="display:flex;align-items:center;gap:12px;">
        <button style="background:none;border:none;cursor:pointer;color:rgba(255,255,255,.65);font-size:20px;padding:0;" id="mpBackBtn">‹</button>
        <div>
          <div style="font-size:11px;opacity:.45;letter-spacing:.5px;text-transform:uppercase;margin-bottom:2px;">⭐ Playlist</div>
          <div style="font-size:16px;font-weight:700;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" id="mpSongsTitle">–</div>
        </div>
      </div>
      <button class="panel-close" id="closeMpSongsBtn">✕</button>
    </div>
    <div id="mpSongsScroll" style="flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:10px 0 30px;"></div>
  </div>
</div>


<!-- ── MODAL FAVORITOS ── -->
<div id="favModal">
  <div class="fav-sheet">
    <h3>⭐ Guardar en playlist</h3>
    <p id="favSongLabel">Agrega esta canción a una playlist personal</p>
    <input class="fav-input" id="favInput" placeholder="Nombre de la playlist..." maxlength="40">
    <div class="fav-existing" id="favExisting"></div>
    <div class="fav-btns">
      <button class="fav-btn fav-cancel" id="favCancel">Cancelar</button>
      <button class="fav-btn fav-confirm" id="favConfirm">Guardar ⭐</button>
    </div>
  </div>
</div>

<audio id="audioPlayer" preload="auto" x-webkit-airplay="allow"></audio>

<div id="app">

  <div class="spacer"></div>

  <!-- Metadata -->
  <div class="meta">

      <div id="songArtist">GHOST1D_Solutions</div>

    </div>

  <!-- Progreso -->
  <div class="times-row">
    <span id="currentTime">0:00</span>

  <!-- Controles -->
  <div class="controls">
    <button class="ctrl-btn" id="prevBtn">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="rgba(255,255,255,.85)"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>

    <svg class="vol-icon" viewBox="0 0 24 24" fill="rgba(255,255,255,.55)"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
    <input type="range" id="volBar" min="0" max="100" value="85">
    <svg class="vol-icon" viewBox="0 0 24 24" fill="rgba(255,255,255,.55)"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>

      color:rgba(255,255,255,.55);padding:4px 0 4px 8px;
      display:flex;align-items:center;flex-shrink:0;
      transition:color .2s;
    ">
      <svg id="btIcon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M17.71 7.71 12 2h-1v7.59L6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 11 14.41V22h1l5.71-5.71-4.3-4.29 4.3-4.29zM13 5.83l1.88 1.88L13 9.59V5.83zm1.88 10.46L13 18.17v-3.76l1.88 1.88z"/>
      </svg>
    </button>
  </div>

  <!-- Toast de dispositivo conectado -->
  <div id="btToast" style="

    padding:10px 20px;font-size:13px;font-weight:500;color:#38bdf8;
    z-index:200;white-space:nowrap;text-align:center;
    animation:slideUp .3s ease;
  "></div>

  <!-- Footer -->
  <footer>
    <button class="foot-btn" id="lyricsBtn">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 14v-2.47l6.88-6.88c.2-.2.51-.2.71 0l1.77 1.77c.2.2.2.51 0 .71L8.47 14H6zm14 0h-8.5l2-2H20v2z"/></svg>
    </button>

      </svg>

    </button>
  </footer>

</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
try {
  Telegram.WebApp.ready();
  Telegram.WebApp.expand();
  // Fusiona la barra nativa de Telegram con el fondo oscuro de la portada
  Telegram.WebApp.setHeaderColor('#000000');
  Telegram.WebApp.setBackgroundColor('#000000');
  // Evita cierre accidental al deslizar
  if(Telegram.WebApp.disableVerticalSwipes) Telegram.WebApp.disableVerticalSwipes();
} catch(e){}

// ── Elementos ──────────────────────────────────────────────────────────────
var audio        = document.getElementById('audioPlayer');
var bgFull       = document.getElementById('bgFull');
var playBtn      = document.getElementById('playBtn');
var playIcon     = document.getElementById('playIcon');
var titleEl      = document.getElementById('songTitle');
var artistEl     = document.getElementById('songArtist');
var seekBar      = document.getElementById('seekBar');
var volBar       = document.getElementById('volBar');
var currEl       = document.getElementById('currentTime');
var durEl        = document.getElementById('durationTime');
var prevBtn      = document.getElementById('prevBtn');
var nextBtn      = document.getElementById('nextBtn');
var starBtn      = document.getElementById('starBtn');
var lyricsBtn    = document.getElementById('lyricsBtn');
var lyricsOverlay= document.getElementById('lyricsOverlay');
var closeLyricsBtn= document.getElementById('closeLyricsBtn');
var lyricsScroll = document.getElementById('lyricsScroll');
var playlistBtn  = document.getElementById('playlistBtn');
var playlistPanel= document.getElementById('playlistPanel');
var closePlBtn   = document.getElementById('closePlBtn');
var plScroll     = document.getElementById('plScroll');
var favModal     = document.getElementById('favModal');
var favInput     = document.getElementById('favInput');
var favConfirm   = document.getElementById('favConfirm');
var favCancel    = document.getElementById('favCancel');
var favExisting  = document.getElementById('favExisting');
var favSongLabel = document.getElementById('favSongLabel');

// ── Parámetros URL ────────────────────────────────────────────────────────
function getParam(k){
  try{
    var s=new URLSearchParams(window.location.search);
    if(s.has(k))return s.get(k);
    var h=new URLSearchParams(window.location.hash.substring(1));
    if(h.has(k))return h.get(k);
  }catch(e){}return null;
}
var titleP = getParam('title');
var artistP= getParam('artist');
var audioP = getParam('audio');
var plP    = getParam('pl');
var piP    = getParam('pi');

var titleStr  = titleP  ? decodeURIComponent(titleP)  : '';
var artistStr = artistP ? decodeURIComponent(artistP) : '';
var audioStr  = audioP  ? decodeURIComponent(audioP)  : '';
var playlist  = [];
var playlistIdx = 0;

if(plP){
  try{ playlist = JSON.parse(decodeURIComponent(plP)); }catch(e){}
}
if(piP){
  try{ playlistIdx = parseInt(piP) || 0; }catch(e){}
}

function esc(s){
  if(!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmt(s, isMinus){
  if(isNaN(s) || s < 0) return '0:00';
  var m = Math.floor(s / 60);
  var sec = Math.floor(s % 60);
  var str = m + ':' + (sec < 10 ? '0' : '') + sec;
  return isMinus ? '-' + str : str;
}

function setPlaying(p){
  if(p){
    playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
  } else {
    playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
  }
}

// ── Media Session API — Controles en pantalla bloqueada ───────────────────
var currentCoverUrl = '';
function updateMediaSession(){
  if(!('mediaSession' in navigator)) return;
  try {
    navigator.mediaSession.metadata = new MediaMetadata({
      title:  titleStr  || 'GHOST1D Player',
      artist: artistStr || '',
      album:  'GHOST1D Player',
      artwork: currentCoverUrl ? [
        {src: currentCoverUrl, sizes:'512x512', type:'image/jpeg'},
        {src: currentCoverUrl, sizes:'256x256', type:'image/jpeg'}
      ] : []
    });
  } catch(e){}
}
function setupMediaSessionHandlers(){
  if(!('mediaSession' in navigator)) return;
  navigator.mediaSession.setActionHandler('play', function(){
    audio.play().then(function(){setPlaying(true);}).catch(function(){});
  });
  navigator.mediaSession.setActionHandler('pause', function(){
    audio.pause(); setPlaying(false);
  });
  navigator.mediaSession.setActionHandler('previoustrack', function(){
    navTo(playlistIdx - 1);
  });
  navigator.mediaSession.setActionHandler('nexttrack', function(){
    navTo(playlistIdx + 1);
  });
  navigator.mediaSession.setActionHandler('seekto', function(details){
    if(audio.duration && details.seekTime != null){
      audio.currentTime = details.seekTime;
      updatePositionState();
    }
  });
  navigator.mediaSession.setActionHandler('seekbackward', function(details){
    audio.currentTime = Math.max(0, audio.currentTime - (details.seekOffset||10));
    updatePositionState();
  });
  navigator.mediaSession.setActionHandler('seekforward', function(details){
    audio.currentTime = Math.min(audio.duration||0, audio.currentTime + (details.seekOffset||10));
    updatePositionState();
  });
}
function updatePositionState(){
  if(!('mediaSession' in navigator)) return;
  if(!audio.duration || isNaN(audio.duration)) return;
  try {
    navigator.mediaSession.setPositionState({
      duration:     audio.duration,
      playbackRate: audio.playbackRate || 1,
      position:     audio.currentTime
    });
  } catch(e){}
}
setupMediaSessionHandlers();

// ── Cargar y aplicar pista ─────────────────────────────────────────────────
function applyTrack(title, artist, audioSrc){
  lyricsLoaded = false;
  lyricsVisible = false;
  lyricsOverlay.classList.remove('visible');
  lyricsBtn.classList.remove('active');
  lrcLines = []; currentLineIndex = -1;
  starBtn.innerText = '☆'; starBtn.classList.remove('fav');

  if(title)  { titleEl.innerText  = title;  titleStr  = title;  }
  if(artist) { artistEl.innerText = artist; artistStr = artist; }

  // Actualizar MediaSession con título/artista ya disponibles (sin carátula aún)
  updateMediaSession();

  // Buscar carátula + preview en iTunes
  var q = (title||titleStr)+' '+(artist||artistStr);
  if(q.trim()){
    fetch('https://itunes.apple.com/search?term='+encodeURIComponent(q.trim())+'&entity=song&limit=1')
      .then(function(r){return r.json();})
      .then(function(d){
        if(d.results && d.results.length > 0){
          var t = d.results[0];
          if(!titleP)  { titleEl.innerText  = t.trackName;  titleStr  = t.trackName;  }
          if(!artistP) { artistEl.innerText = t.artistName; artistStr = t.artistName; }
          if(t.artworkUrl100){
            var img = t.artworkUrl100.replace('100x100bb','600x600bb');
            bgFull.style.backgroundImage = 'url('+img+')';
            currentCoverUrl = img;
          }
          if(!audioSrc && t.previewUrl){ audio.src=t.previewUrl; audio.load(); }
          // Actualizar MediaSession con carátula real
          updateMediaSession();
        }
      }).catch(function(){});
  }

  if(audioSrc){ audio.src=audioSrc; audio.load(); }
}

// Carga inicial
applyTrack(titleStr, artistStr, audioStr);

// ── Desbloqueo Android ─────────────────────────────────────────────────────

// ── Bluetooth / Cast / AirPlay ─────────────────────────────────────────────
var btBtn   = document.getElementById('btBtn');
var btIcon  = document.getElementById('btIcon');
var btToast = document.getElementById('btToast');
var btToastTimer = null;

function showToast(msg, color){
  btToast.innerText = msg;
  btToast.style.color = color || '#38bdf8';
  btToast.style.borderColor = (color||'#38bdf8').replace('1)','0.4)');
  btToast.style.background = (color||'#38bdf8').replace('1)','0.12)');
  btToast.style.display = 'block';
  clearTimeout(btToastTimer);
  btToastTimer = setTimeout(function(){ btToast.style.display='none'; }, 3500);
}

function setBtConnected(label){
  btBtn.style.color = '#38bdf8';
  btIcon.innerHTML = '<path d="M17.71 7.71 12 2h-1v7.59L6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 11 14.41V22h1l5.71-5.71-4.3-4.29 4.3-4.29zM13 5.83l1.88 1.88L13 9.59V5.83zm1.88 10.46L13 18.17v-3.76l1.88 1.88z"/>'
    +'<circle cx="19" cy="5" r="4" fill="#22c55e" stroke="#000" stroke-width="1"/>';
  showToast('✅ Conectado: '+(label||'Dispositivo'), '#22c55e');
}

btBtn.addEventListener('click', function(e){
  e.stopPropagation(); unlocked=true;

  // ── Intento 1: Web Audio Output API (Bluetooth / auriculares / altavoz) ──
  if(navigator.mediaDevices && navigator.mediaDevices.selectAudioOutput){
    navigator.mediaDevices.selectAudioOutput()
      .then(function(device){
        return audio.setSinkId(device.deviceId).then(function(){ return device; });
      })
      .then(function(device){
        setBtConnected(device.label);
      })
      .catch(function(err){
        if(err.name !== 'AbortError') tryRemotePlayback();
      });
    return;
  }

  // ── Intento 2: AirPlay (iOS Safari / WKWebView) ──────────────────────────
  if(audio.webkitShowPlaybackTargetPicker){
    audio.webkitShowPlaybackTargetPicker();
    showToast('📡 Selecciona un dispositivo AirPlay');
    return;
  }

  // ── Intento 3: Remote Playback API (Chromecast, TV, red) ─────────────────
  tryRemotePlayback();
});

function tryRemotePlayback(){
  if(audio.remote && audio.remote.prompt){
    audio.remote.prompt()
      .then(function(){
        showToast('📡 Conectado a dispositivo remoto', '#a78bfa');
        btBtn.style.color = '#a78bfa';
      })
      .catch(function(err){
        if(err.name === 'InvalidStateError'){
          showToast('⚠️ Reproduce audio primero para conectar', '#f59e0b');
        } else if(err.name === 'NotSupportedError' || err.name === 'AbortError'){
          showNoSupport();
        } else {
          showToast('❌ '+err.message, '#ef4444');
        }
      });
    return;
  }
  showNoSupport();
}

function showNoSupport(){
  showToast('📱 Conecta el Bluetooth desde Ajustes del celular antes de reproducir', '#f59e0b');
  // Abrir configuración Bluetooth vía Telegram si disponible
  try {
    if(Telegram.WebApp.openLink){
      setTimeout(function(){
        // No podemos abrir ajustes directamente, solo informamos
      }, 500);
    }
  } catch(e){}
}

// Detectar si se desconecta el dispositivo remoto
if(audio.remote){
  audio.remote.onconnect    = function(){ btBtn.style.color='#a78bfa'; };
  audio.remote.ondisconnect = function(){ btBtn.style.color='rgba(255,255,255,.55)'; btIcon.innerHTML='<path d="M17.71 7.71 12 2h-1v7.59L6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 11 14.41V22h1l5.71-5.71-4.3-4.29 4.3-4.29zM13 5.83l1.88 1.88L13 9.59V5.83zm1.88 10.46L13 18.17v-3.76l1.88 1.88z"/>'; };
}

// ── Prev / Next ───────────────────────────────────────────────────────────
function updateNavBtns(){
  if(playlist.length===0){prevBtn.classList.add('dim');nextBtn.classList.add('dim');return;}
  prevBtn.classList.toggle('dim', playlistIdx<=0);
  nextBtn.classList.toggle('dim', playlistIdx>=playlist.length-1);
}

function navTo(newIdx){
  if(newIdx<0||newIdx>=playlist.length)return;
  playlistIdx=newIdx;
  var item=playlist[newIdx];
  var wasPlaying=!audio.paused;
  applyTrack(item.t, item.a, '');
  updateNavBtns();
  updatePlActive();
  if(wasPlaying){
    setTimeout(function(){
      audio.play().then(function(){setPlaying(true);}).catch(function(){});
    },500);
  }
}

function openFavModal(){

favConfirm.addEventListener('click',function(e){
  e.stopPropagation();
  var plName=(favInput.value||'').trim();
  if(!plName){favInput.focus();favInput.style.borderColor='#ef4444';return;}
  favInput.style.borderColor='';

  // ── Guardar nombre de playlist ──
  if(!savedFavPlaylists.includes(plName)){
    savedFavPlaylists.unshift(plName);
    if(savedFavPlaylists.length>10)savedFavPlaylists.pop();
    try{localStorage.setItem('ghost1d_playlists',JSON.stringify(savedFavPlaylists));}catch(e){}
  }

  // ── Guardar la canción dentro de la playlist en localStorage ──
  var song = {t: titleStr, a: artistStr};
  var plKey = 'ghost1d_pl_songs_' + plName;
  var existing = [];
  try{ var ex=localStorage.getItem(plKey); if(ex) existing=JSON.parse(ex); }catch(e){}
  // Evitar duplicados
  var isDup = existing.some(function(s){return s.t===song.t && s.a===song.a;});
  if(!isDup){
    existing.unshift(song);
    try{localStorage.setItem(plKey, JSON.stringify(existing));}catch(e){}
  }

  // ── Marcar estrella visualmente ──
  starBtn.innerText='⭐'; starBtn.classList.add('fav');
  favModal.classList.remove('visible');

  // ── Enviar al bot para persistencia en el servidor también ──
  var data=JSON.stringify({action:'add_to_playlist',playlist:plName,title:titleStr,artist:artistStr});
  try{ Telegram.WebApp.sendData(data); }catch(e){ console.log('sendData fallback:',e); }
});

// ── Letras Sincronizadas ──────────────────────────────────────────────────
var lyricsVisible=false,lyricsLoaded=false;
var lrcLines=[],currentLineIndex=-1;
function parseLRC(txt){
  var lines=[],re=/\[(\d{2}):(\d{2})\.(\d{2,3})\](.*)/;
  txt.split('\n').forEach(function(l){
    var m=l.match(re);
    if(m){var s=parseInt(m[1])*60+parseInt(m[2])+parseInt(m[3])/1000;var t=m[4].trim();if(t)lines.push({time:s,text:t});}
  });
  return lines.sort(function(a,b){return a.time-b.time;});
}
function renderLyrics(){
  if(!lrcLines.length){lyricsScroll.innerHTML='<div class="lyric-none">😔 Sin letra sincronizada.<br>Disfruta la música 🎵</div>';return;}
  var h='<div style="height:50px"></div>';
  lrcLines.forEach(function(l,i){h+='<div class="lyric-line" id="ll'+i+'">'+esc(l.text)+'</div>';});
  h+='<div style="height:120px"></div>';
  lyricsScroll.innerHTML=h;
}
function updateActiveLine(t){
  if(!lrcLines.length)return;
  var ni=-1;
  for(var i=0;i<lrcLines.length;i++){if(lrcLines[i].time<=t)ni=i;else break;}
  if(ni===currentLineIndex)return;
  currentLineIndex=ni;
  lyricsScroll.querySelectorAll('.lyric-line').forEach(function(el,i){
    el.classList.remove('active','past');
    if(i<currentLineIndex)el.classList.add('past');
    else if(i===currentLineIndex)el.classList.add('active');
  });
  if(currentLineIndex>=0){var el=document.getElementById('ll'+currentLineIndex);if(el)lyricsScroll.scrollTo({top:el.offsetTop-(lyricsScroll.clientHeight/2)+(el.clientHeight/2),behavior:'smooth'});}
}
function fetchLyrics(){
  if(lyricsLoaded)return;lyricsLoaded=true;
  lyricsScroll.innerHTML='<div class="lyric-loading">🎤 Buscando letra...</div>';
  fetch('https://lrclib.net/api/search?q='+encodeURIComponent(titleStr+' '+artistStr))
    .then(function(r){return r.json();})
    .then(function(data){
      if(!data||!data.length){lyricsScroll.innerHTML='<div class="lyric-none">😔 Sin letra disponible</div>';return;}
      var synced=null;
      for(var i=0;i<data.length;i++){if(data[i].syncedLyrics){synced=data[i].syncedLyrics;break;}}
      if(synced){lrcLines=parseLRC(synced);renderLyrics();updateActiveLine(audio.currentTime);}
      else{
        var plain=data[0].plainLyrics||'';
        if(plain){
          var h='<div style="height:30px"></div>';
          plain.split('\n').forEach(function(l){h+=l.trim()?'<div class="lyric-line" style="color:rgba(255,255,255,.65)">'+esc(l)+'</div>':'<div style="height:10px"></div>';});
          lyricsScroll.innerHTML=h;
        }else lyricsScroll.innerHTML='<div class="lyric-none">😔 Sin letra disponible</div>';
      }
    }).catch(function(){lyricsScroll.innerHTML='<div class="lyric-none">⚠️ Error de conexión</div>';});
}
lyricsBtn.addEventListener('click',function(e){
  e.stopPropagation();unlocked=true;
  lyricsVisible=!lyricsVisible;
  if(lyricsVisible){lyricsOverlay.classList.add('visible');lyricsBtn.classList.add('active');fetchLyrics();}
  else{lyricsOverlay.classList.remove('visible');lyricsBtn.classList.remove('active');}
});
closeLyricsBtn.addEventListener('click',function(e){
  e.stopPropagation();lyricsVisible=false;
  lyricsOverlay.classList.remove('visible');lyricsBtn.classList.remove('active');
});
