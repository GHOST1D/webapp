<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Musik Ghost Player WebApp</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            touch-action: none;
            background: linear-gradient(135deg, #0f172a 0%, #020617 100%);
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .vinyl-spin {
            animation: spin 8s linear infinite;
        }
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
        .paused {
            animation-play-state: paused !important;
        }
        /* Transición suave para la aguja del tocadiscos */
        .tonearm-transition {
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: 85% 15%;
        }
    </style>
</head>
<body class="h-full flex flex-col justify-between p-3 max-w-md mx-auto select-none overflow-hidden">
    
    <!-- Elemento Audio HTML5 para Reproducción Completa -->
    <audio id="audioPlayer" preload="auto"></audio>

    <!-- Header -->
    <header class="flex justify-between items-center py-1">
        <div class="flex items-center space-x-2">
            <span class="text-emerald-400 font-bold text-base"><i class="fa-solid fa-bolt mr-1"></i> GHOST1D Player</span>
        </div>
        <span class="text-[10px] px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 font-mono">PRO V2.0</span>
    </header>

    <!-- Album Art, Vinyl & Turntable Tonearm View -->
    <main class="flex-1 flex flex-col items-center justify-center my-2 overflow-hidden">
        <div class="relative w-56 h-56 sm:w-64 sm:h-64 flex items-center justify-center">
            
            <!-- Aguja del Tocadiscos (Tonearm) -->
            <div id="tonearm" class="absolute -top-4 right-2 z-30 w-16 h-32 tonearm-transition transform rotate-[-30deg]">
                <!-- Base Pivote -->
                <div class="absolute top-1 right-1 w-7 h-7 rounded-full bg-gradient-to-tr from-slate-700 to-slate-500 border-2 border-slate-400 shadow-xl flex items-center justify-center">
                    <div class="w-2.5 h-2.5 rounded-full bg-slate-900"></div>
                </div>
                <!-- Brazo Metálico -->
                <div class="absolute top-5 right-3.5 w-1.5 h-24 bg-gradient-to-b from-slate-300 via-slate-100 to-slate-400 rounded-full shadow-lg"></div>
                <!-- Cabezal y Aguja del Tocadiscos -->
                <div class="absolute bottom-1 right-2.5 w-4 h-7 bg-slate-900 border border-emerald-400 rounded-sm shadow-md flex flex-col items-center justify-end">
                    <div class="w-1.5 h-2 bg-emerald-400 rounded-full animate-pulse"></div>
                </div>
            </div>

            <!-- Vinyl Disk Background -->
            <div id="vinylDisk" class="absolute w-48 h-48 sm:w-56 sm:h-56 rounded-full bg-slate-950 border-4 border-slate-800 flex items-center justify-center shadow-2xl vinyl-spin paused">
                <!-- Ranuras del Vinilo -->
                <div class="absolute inset-2 rounded-full border border-slate-800/80"></div>
                <div class="absolute inset-5 rounded-full border border-slate-800/60"></div>
                <div class="absolute inset-8 rounded-full border border-slate-800/40"></div>
                
                <!-- Centro del Disco -->
                <div class="w-16 h-16 sm:w-20 sm:h-20 rounded-full bg-gradient-to-tr from-emerald-500 to-teal-400 border-4 border-slate-900 flex items-center justify-center z-0">
                    <div class="w-3.5 h-3.5 rounded-full bg-slate-900"></div>
                </div>
            </div>

            <!-- Cover Art Over -->
            <img id="coverArt" src="https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=500&auto=format&fit=crop" 
                 class="relative z-10 w-36 h-36 sm:w-44 sm:h-44 rounded-2xl object-cover shadow-2xl border border-slate-700/60 transition-all duration-300 transform hover:scale-105">
        </div>

        <!-- Song Metadata -->
        <div class="text-center mt-4 px-2">
            <h2 id="songTitle" class="text-lg font-bold text-white truncate max-w-[280px]">Cargando canción...</h2>
            <p id="songArtist" class="text-slate-400 text-xs mt-0.5 truncate max-w-[260px]">GHOST1D_Solutions Catalog</p>
        </div>
    </main>

    <!-- Controls & Progress -->
    <footer class="glass rounded-2xl p-4 mb-1 shadow-2xl space-y-3">
        <!-- Progress Bar -->
        <div class="space-y-1">
            <input type="range" id="seekBar" value="0" max="100" class="w-full h-1 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-emerald-400">
            <div class="flex justify-between text-[11px] text-slate-400 font-mono">
                <span id="currentTime">0:00</span>
                <span id="durationTime">0:00</span>
            </div>
        </div>

        <!-- Buttons Row -->
        <div class="flex justify-between items-center px-2">
            <button class="text-slate-400 hover:text-white transition"><i class="fa-solid fa-shuffle text-base"></i></button>
            <button class="text-slate-200 hover:text-white text-lg transition"><i class="fa-solid fa-backward-step"></i></button>
            <button id="playBtn" class="w-12 h-12 rounded-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 flex items-center justify-center text-lg font-bold shadow-lg shadow-emerald-500/30 transition transform active:scale-95">
                <i class="fa-solid fa-play ml-0.5"></i>
            </button>
            <button class="text-slate-200 hover:text-white text-lg transition"><i class="fa-solid fa-forward-step"></i></button>
            <button class="text-emerald-400 hover:text-emerald-300 transition"><i class="fa-solid fa-repeat text-base"></i></button>
        </div>
    </footer>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            tg.ready();
        }

        const audio = document.getElementById('audioPlayer');
        const vinyl = document.getElementById('vinylDisk');
        const tonearm = document.getElementById('tonearm');
        const playBtn = document.getElementById('playBtn');
        const coverArt = document.getElementById('coverArt');
        const songTitle = document.getElementById('songTitle');
        const songArtist = document.getElementById('songArtist');
        const seekBar = document.getElementById('seekBar');
        const currentTimeEl = document.getElementById('currentTime');
        const durationTimeEl = document.getElementById('durationTime');

        function getQueryOrHashParam(key) {
            const searchParams = new URLSearchParams(window.location.search);
            if (searchParams.has(key)) return searchParams.get(key);
            const hashParams = new URLSearchParams(window.location.hash.substring(1));
            if (hashParams.has(key)) return hashParams.get(key);
            return null;
        }

        const titleParam = getQueryOrHashParam('title');
        const artistParam = getQueryOrHashParam('artist');

        if (titleParam) {
            songTitle.innerText = decodeURIComponent(titleParam);
        } else {
            songTitle.innerText = "Reproduciendo Pista";
        }

        if (artistParam) {
            songArtist.innerText = decodeURIComponent(artistParam);
        } else {
            songArtist.innerText = "GHOST1D_Solutions Catalog";
        }

        // Cargar Carátula HD y Audio Completo mediante iTunes API
        if (titleParam && artistParam) {
            const searchQuery = encodeURIComponent(decodeURIComponent(titleParam) + " " + decodeURIComponent(artistParam));
            fetch(`https://itunes.apple.com/search?term=${searchQuery}&entity=song&limit=1`)
                .then(res => res.json())
                .then(data => {
                    if (data.results && data.results.length > 0) {
                        const track = data.results[0];
                        
                        if (track.artworkUrl100) {
                            coverArt.src = track.artworkUrl100.replace('100x100bb', '500x500bb');
                        }
                        
                        if (track.previewUrl) {
                            audio.src = track.previewUrl;
                            audio.load();
                        }
                    }
                })
                .catch(err => console.log("Metadata error:", err));
        }

        function formatTime(seconds) {
            if (isNaN(seconds)) return "0:00";
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function setTurntablePlayingState(playing) {
            if (playing) {
                vinyl.classList.remove('paused');
                tonearm.style.transform = 'rotate(0deg)'; // La aguja se posa sobre el vinilo
                playBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
            } else {
                vinyl.classList.add('paused');
                tonearm.style.transform = 'rotate(-30deg)'; // La aguja se levanta a su posición de descanso
                playBtn.innerHTML = '<i class="fa-solid fa-play ml-0.5"></i>';
            }
        }

        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const pct = (audio.currentTime / audio.duration) * 100;
                seekBar.value = pct;
                currentTimeEl.innerText = formatTime(audio.currentTime);
                durationTimeEl.innerText = formatTime(audio.duration);
            }
        });

        audio.addEventListener('loadedmetadata', () => {
            durationTimeEl.innerText = formatTime(audio.duration);
        });

        audio.addEventListener('ended', () => {
            setTurntablePlayingState(false);
            seekBar.value = 0;
            currentTimeEl.innerText = "0:00";
        });

        seekBar.addEventListener('input', () => {
            if (audio.duration) {
                audio.currentTime = (seekBar.value / 100) * audio.duration;
            }
        });

        playBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (audio.src) {
                if (audio.paused) {
                    audio.play().then(() => {
                        setTurntablePlayingState(true);
                    }).catch(err => {
                        console.log("Play error:", err);
                    });
                } else {
                    audio.pause();
                    setTurntablePlayingState(false);
                }
            } else {
                // Simulación visual interactiva si la canción se está cargando
                const isPaused = vinyl.classList.contains('paused');
                setTurntablePlayingState(isPaused);
            }
        });
    </script>
</body>
</html>
