<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Musik Ghost Player WebApp</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #020617 100%);
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .vinyl-spin {
            animation: spin 12s linear infinite;
        }
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
        .paused {
            animation-play-state: paused;
        }
    </style>
</head>
<body class="h-screen flex flex-col justify-between p-4 max-w-md mx-auto select-none">
    
    <!-- Header -->
    <header class="flex justify-between items-center py-2">
        <div class="flex items-center space-x-2">
            <span class="text-emerald-400 font-bold text-lg"><i class="fa-solid fa-bolt mr-1"></i> GHOST1D Player</span>
        </div>
        <span class="text-xs px-2 py-1 rounded-full bg-emerald-500/20 text-emerald-300 font-mono">PRO V2.0</span>
    </header>

    <!-- Album Art & Vinyl View -->
    <main class="flex-1 flex flex-col items-center justify-center my-4">
        <div class="relative w-64 h-64 flex items-center justify-center">
            <!-- Vinyl Disk Background -->
            <div id="vinylDisk" class="absolute w-60 h-60 rounded-full bg-black border-4 border-slate-800 flex items-center justify-center shadow-2xl vinyl-spin paused">
                <div class="w-20 h-20 rounded-full bg-gradient-to-tr from-emerald-500 to-teal-400 border-4 border-slate-900 flex items-center justify-center">
                    <div class="w-4 h-4 rounded-full bg-slate-900"></div>
                </div>
            </div>
            <!-- Cover Art Over -->
            <img id="coverArt" src="https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=500&auto=format&fit=crop" 
                 class="relative z-10 w-44 h-44 rounded-2xl object-cover shadow-lg border border-slate-700/50 transition-all duration-300 transform hover:scale-105">
        </div>

        <!-- Song Metadata -->
        <div class="text-center mt-6">
            <h2 id="songTitle" class="text-xl font-bold text-white truncate max-w-xs">Selecciona una Canción</h2>
            <p id="songArtist" class="text-slate-400 text-sm mt-1">GHOST1D_Solutions Catalog</p>
        </div>
    </main>

    <!-- Controls & Progress -->
    <footer class="glass rounded-3xl p-5 mb-2 shadow-2xl">
        <!-- Progress Bar -->
        <div class="space-y-1 mb-4">
            <input type="range" id="seekBar" value="0" max="100" class="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-emerald-400">
            <div class="flex justify-between text-xs text-slate-400 font-mono">
                <span id="currentTime">0:00</span>
                <span id="durationTime">3:45</span>
            </div>
        </div>

        <!-- Buttons Row -->
        <div class="flex justify-between items-center px-4">
            <button class="text-slate-400 hover:text-white transition"><i class="fa-solid fa-shuffle text-lg"></i></button>
            <button class="text-slate-200 hover:text-white text-xl transition"><i class="fa-solid fa-backward-step"></i></button>
            <button id="playBtn" class="w-14 h-14 rounded-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 flex items-center justify-center text-xl font-bold shadow-lg shadow-emerald-500/30 transition transform active:scale-95">
                <i class="fa-solid fa-play ml-1"></i>
            </button>
            <button class="text-slate-200 hover:text-white text-xl transition"><i class="fa-solid fa-forward-step"></i></button>
            <button class="text-emerald-400 hover:text-emerald-300 transition"><i class="fa-solid fa-repeat text-lg"></i></button>
        </div>
    </footer>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            tg.ready();
        }

        const vinyl = document.getElementById('vinylDisk');
        const playBtn = document.getElementById('playBtn');
        let isPlaying = false;

        playBtn.addEventListener('click', () => {
            isPlaying = !isPlaying;
            if (isPlaying) {
                vinyl.classList.remove('paused');
                playBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
            } else {
                vinyl.classList.add('paused');
                playBtn.innerHTML = '<i class="fa-solid fa-play ml-1"></i>';
            }
        });
    </script>
</body>
</html>
