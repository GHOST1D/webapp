<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Musik Ghost Player WebApp</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            touch-action: none;
            background: linear-gradient(135deg, #020617 0%, #0f172a 50%, #020617 100%);
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .glass {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(56, 189, 248, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }
        .vinyl-spin {
            animation: spin 8s linear infinite;
        }
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
        .paused {
            animation-play-state: paused !important;
        }
        .tonearm-transition {
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: 85% 15%;
        }
        .neon-blue-glow {
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
        }
        .red-pulsing-dot {
            box-shadow: 0 0 10px #ef4444, 0 0 20px #ef4444;
        }
    </style>
</head>
<body class="h-full flex flex-col justify-between p-3 max-w-md mx-auto select-none overflow-hidden">
    
    <!-- Elemento Audio HTML5 para Reproducción Real -->
    <audio id="audioPlayer" preload="auto"></audio>

    <!-- Header -->
    <header class="flex justify-between items-center py-1">
        <div class="flex items-center space-x-2">
            <!-- Punto Rojo Pulsante Neón -->
            <div class="relative flex items-center justify-center">
                <span class="absolute inline-flex h-3 w-3 rounded-full bg-red-500 opacity-75 animate-ping"></span>
                <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-red-600 red-pulsing-dot"></span>
            </div>
            <span class="text-cyan-400 font-bold text-base tracking-wide"><i class="fa-solid fa-bolt mr-1 text-cyan-300"></i> GHOST1D Player</span>
        </div>
        <span class="text-[10px] px-2.5 py-0.5 rounded-full bg-cyan-500/20 border border-cyan-500/40 text-cyan-300 font-mono tracking-wider">NEON V2.0</span>
    </header>

    <!-- Album Art, Vinyl & Turntable Tonearm View -->
    <main class="flex-1 flex flex-col items-center justify-center my-2 overflow-hidden">
        <div class="relative w-56 h-56 sm:w-64 sm:h-64 flex items-center justify-center">
            
            <!-- Aguja del Tocadiscos (Tonearm) -->
            <div id="tonearm" class="absolute -top-4 right-2 z-30 w-16 h-32 tonearm-transition transform rotate-[-30deg]">
                <div class="absolute top-1 right-1 w-7 h-7 rounded-full bg-gradient-to-tr from-slate-800 to-slate-600 border-2 border-cyan-400/50 shadow-xl flex items-center justify-center">
                    <div class="w-2.5 h-2.5 rounded-full bg-cyan-400 shadow-[0_0_8px_#38bdf8]"></div>
                </div>
                <div class="absolute top-5 right-3.5 w-1.5 h-24 bg-gradient-to-b from-slate-400 via-cyan-100 to-slate-500 rounded-full shadow-lg"></div>
                <div class="absolute bottom-1 right-2.5 w-4 h-7 bg-slate-950 border border-cyan-400 rounded-sm shadow-md flex flex-col items-center justify-end">
                    <div class="w-1.5 h-2 bg-red-500 rounded-full animate-pulse red-pulsing-dot"></div>
                </div>
            </div>

            <!-- Vinyl Disk Background -->
            <div id="vinylDisk" class="absolute w-48 h-48 sm:w-56 sm:h-56 rounded-full bg-slate-950 border-4 border-slate-800 flex items-center justify-center shadow-2xl vinyl-spin paused">
                <div class="absolute inset-2 rounded-full border border-cyan-900/30"></div>
                <div class="absolute inset-5 rounded-full border border-cyan-800/20"></div>
                <div class="absolute inset-8 rounded-full border border-cyan-800/10"></div>
                
                <div class="w-16 h-16 sm:w-20 sm:h-20 rounded-full bg-gradient-to-tr from-cyan-600 via-blue-500 to-cyan-400 border-4 border-slate-900 flex items-center justify-center z-0 shadow-[0_0_15px_rgba(56,189,248,0.4)]">
                    <div class="w-3.5 h-3.5 rounded-full bg-slate-950"></div>
                </div>
            </div>

            <!-- Cover Art Over con Borde Azul Neón -->
            <img id="coverArt" src="https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=500&auto=format&fit=crop" 
                 class="relative z-10 w-36 h-36 sm:w-44 sm:h-44 rounded-2xl object-cover shadow-2xl border-2 border-cyan-400/40 transition-all duration-300 transform hover:scale-105 neon-blue-glow">
        </div>

        <!-- Song Metadata -->
        <div class="text-center mt-4 px-2">
            <h2 id="songTitle" class="text-lg font-bold text-white truncate max-w-[280px]">Cargando canción...</h2>
            <p id="songArtist" class="text-cyan-400/80 text-xs mt-0.5 truncate max-w-[260px] font-medium">GHOST1D_Solutions Catalog</p>
        </div>
    </main>

    <!-- Controls & Progress -->
    <footer class="glass rounded-2xl p-4 mb-1 space-y-3">
        <!-- Progress Bar -->
        <div class="space-y-1">
            <input type="range" id="seekBar" value="0" max="100" class="w-full h-1 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-cyan-400">
            <div class="flex justify-between text-[11px] text-cyan-300/80 font-mono">
                <span id="currentTime">0:00</span>
                <span id="durationTime">0:00</span>
            </div>
        </div>

        <!-- Buttons Row Azul Neón -->
        <div class="flex justify-between items-center px-2">
            <button class="text-slate-400 hover:text-cyan-400 transition"><i class="fa-solid fa-shuffle text-base"></i></button>
            <button class="text-slate-200 hover:text-cyan-400 text-lg transition"><i class="fa-solid fa-backward-step"></i></button>
            <button id="playBtn" class="w-12 h-12 rounded-full bg-gradient-to-tr from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 flex items-center justify-center text-lg font-bold shadow-lg neon-blue-glow transition transform active:scale-95">
                <i class="fa-solid fa-play ml-0.5 text-slate-950"></i>
            </button>
            <button class="text-slate-200 hover:text-cyan-400 text-lg transition"><i class="fa-solid fa-forward-step"></i></button>
            <button class="text-cyan-400 hover:text-cyan-300 transition"><i class="fa-solid fa-repeat text-base"></i></button>
        </div>
    </footer>

    <script>
        // NOTIFICAR A TELEGRAM DE INMEDIATO QUE LA WEBAPP ESTÁ LISTA (Evita la pantalla de carga infinita)
        const tg = window.Telegram?.WebApp;
        if (tg) {
            try {
                tg.ready();
                tg.expand();
            } catch(e) { console.log(e); }
        }

        const audio = document.getElementById('audioPlayer');
        const vinyl = document.getElementById('vinylDisk');
        const tonearm = document.getElementById('tonearm');
        const playBtn = document.getElementById('playBtn');
        const coverArt = document.getElementById('coverArt');
        const songTitle = document.getElementById('songTitle');
        const songArtist = document.getElementById('songArtist');
        const seekBar = document.getElementById('seekBar');
        const currentTimeEl = document.getElementById('currentTime');
        const durationTimeEl = document.getElementById('durationTime');

        function getParam(key) {
            try {
                const searchParams = new URLSearchParams(window.location.search);
                if (searchParams.has(key)) return searchParams.get(key);
                const hashParams = new URLSearchParams(window.location.hash.substring(1));
                if (hashParams.has(key)) return hashParams.get(key);
            } catch(e) {}
            return null;
        }

        const rawStartParam = tg?.initDataUnsafe?.start_param || getParam('startapp') || getParam('tgWebAppStartParam');
        const titleParam = getParam('title');
        const artistParam = getParam('artist');

        let searchQuery = "";

        if (titleParam) {
            searchQuery = decodeURIComponent(titleParam) + " " + (artistParam ? decodeURIComponent(artistParam) : "");
            songTitle.innerText = decodeURIComponent(titleParam);
            if (artistParam) songArtist.innerText = decodeURIComponent(artistParam);
        } else if (rawStartParam) {
            let cleanQuery = rawStartParam.replace(/_/g, " ");
            searchQuery = cleanQuery;
            songTitle.innerText = cleanQuery;
            songArtist.innerText = "GHOST1D_Solutions Catalog";
        } else {
            songTitle.innerText = "Reproduciendo Pista";
            songArtist.innerText = "GHOST1D_Solutions Catalog";
        }

        // Búsqueda asíncrona no bloqueante de Carátula HD y Audio
        if (searchQuery) {
            fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(searchQuery)}&entity=song&limit=1`)
                .then(res => res.json())
                .then(data => {
                    if (data.results && data.results.length > 0) {
                        const track = data.results[0];
                        songTitle.innerText = track.trackName;
                        songArtist.innerText = track.artistName;
                        
                        if (track.artworkUrl100) {
                            coverArt.src = track.artworkUrl100.replace('100x100bb', '500x500bb');
                        }
                        
                        if (track.previewUrl) {
                            audio.src = track.previewUrl;
                            audio.load();
                        }
                    }
                })
                .catch(err => console.log("Search error:", err));
        }

        function formatTime(seconds) {
            if (isNaN(seconds)) return "0:00";
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function setTurntablePlayingState(playing) {
            if (playing) {
                vinyl.classList.remove('paused');
                tonearm.style.transform = 'rotate(0deg)';
                playBtn.innerHTML = '<i class="fa-solid fa-pause text-slate-950"></i>';
            } else {
                vinyl.classList.add('paused');
                tonearm.style.transform = 'rotate(-30deg)';
                playBtn.innerHTML = '<i class="fa-solid fa-play ml-0.5 text-slate-950"></i>';
            }
        }

        function unlockAudioOnGesture() {
            if (audio.src && audio.paused) {
                audio.play().then(() => {
                    setTurntablePlayingState(true);
                }).catch(e => console.log(e));
            }
        }
        document.addEventListener('click', unlockAudioOnGesture, { once: true });
        document.addEventListener('touchstart', unlockAudioOnGesture, { once: true });

        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const pct = (audio.currentTime / audio.duration) * 100;
                seekBar.value = pct;
                currentTimeEl.innerText = formatTime(audio.currentTime);
                durationTimeEl.innerText = formatTime(audio.duration);
            }
        });

        audio.addEventListener('loadedmetadata', () => {
            durationTimeEl.innerText = formatTime(audio.duration);
        });

        audio.addEventListener('ended', () => {
            setTurntablePlayingState(false);
            seekBar.value = 0;
            currentTimeEl.innerText = "0:00";
        });

        seekBar.addEventListener('input', () => {
            if (audio.duration) {
                audio.currentTime = (seekBar.value / 100) * audio.duration;
            }
        });

        playBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (audio.src) {
                if (audio.paused) {
                    audio.play().then(() => {
                        setTurntablePlayingState(true);
                    });
                } else {
                    audio.pause();
                    setTurntablePlayingState(false);
                }
            } else {
                const isPaused = vinyl.classList.contains('paused');
                setTurntablePlayingState(isPaused);
            }
        });
    </script>
</body>
</html>
